<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidey Cinema - Recommandation de Films by Mami RF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Image Spider-Man en fond complet */
        .spiderman-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .spiderman-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1712574784210-9def3584410b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxzcGlkZXJtYW4lMjBmdWxsJTIwYm9keSUyMGFjdGlvbnxlbnwxfHx8fDE3NzIxNzMyNTl8MA&ixlib=rb-4.1.0&q=80&w=1080');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: brightness(0.4);
        }

        .spiderman-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(220, 20, 60, 0.3) 0%,
                rgba(0, 71, 171, 0.4) 50%,
                rgba(0, 0, 0, 0.7) 100%
            );
        }

        /* Toiles d'araignée overlay */
        .web-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.2;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 20% 30%, transparent 0%, transparent 2%, rgba(255, 255, 255, 0.2) 2%, transparent 3%),
                radial-gradient(circle at 80% 70%, transparent 0%, transparent 2%, rgba(255, 255, 255, 0.2) 2%, transparent 3%),
                radial-gradient(circle at 40% 80%, transparent 0%, transparent 2%, rgba(255, 255, 255, 0.2) 2%, transparent 3%),
                radial-gradient(circle at 60% 20%, transparent 0%, transparent 2%, rgba(255, 255, 255, 0.2) 2%, transparent 3%),
                repeating-linear-gradient(45deg, transparent, transparent 50px, rgba(255, 255, 255, 0.05) 50px, rgba(255, 255, 255, 0.05) 51px),
                repeating-linear-gradient(-45deg, transparent, transparent 50px, rgba(255, 255, 255, 0.05) 50px, rgba(255, 255, 255, 0.05) 51px);
        }

        /* Toiles d'araignée animées dans les coins */
        .corner-web {
            position: fixed;
            width: 350px;
            height: 350px;
            z-index: 2;
            pointer-events: none;
            animation: webPulse 3s ease-in-out infinite;
            opacity: 0.6;
        }

        .corner-web.top-left { top: 0; left: 0; }
        .corner-web.top-right { top: 0; right: 0; transform: scaleX(-1); }
        .corner-web.bottom-left { bottom: 0; left: 0; transform: scaleY(-1); }
        .corner-web.bottom-right { bottom: 0; right: 0; transform: scale(-1); }

        @keyframes webPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Toiles d'araignée flottantes */
        .floating-web {
            position: fixed;
            width: 150px;
            height: 150px;
            opacity: 0.3;
            z-index: 2;
            pointer-events: none;
            animation: float 15s ease-in-out infinite;
        }

        .floating-web:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-web:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }

        .floating-web:nth-child(3) {
            bottom: 15%;
            left: 30%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-30px, 30px) rotate(240deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 30px;
        }

        .title {
            font-size: 5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 
                3px 3px 0 #DC143C,
                6px 6px 0 #0047AB,
                0 0 30px rgba(220, 20, 60, 1),
                0 0 60px rgba(0, 71, 171, 0.8);
            letter-spacing: 8px;
            margin-bottom: 15px;
            font-family: Impact, sans-serif;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 
                    3px 3px 0 #DC143C,
                    6px 6px 0 #0047AB,
                    0 0 30px rgba(220, 20, 60, 1),
                    0 0 60px rgba(0, 71, 171, 0.8);
            }
            50% { 
                text-shadow: 
                    3px 3px 0 #DC143C,
                    6px 6px 0 #0047AB,
                    0 0 50px rgba(220, 20, 60, 1),
                    0 0 100px rgba(0, 71, 171, 1);
            }
        }

        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(220, 20, 60, 0.6);
            font-weight: bold;
        }

        /* Carte de formulaire */
        .card {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #DC143C;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 
                0 15px 50px rgba(220, 20, 60, 0.6),
                0 0 100px rgba(0, 71, 171, 0.4),
                inset 0 0 30px rgba(220, 20, 60, 0.2);
            position: relative;
            backdrop-filter: blur(15px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(45deg, #DC143C, #0047AB, #DC143C, #0047AB);
            border-radius: 20px;
            z-index: -1;
            opacity: 0.6;
            animation: borderGlow 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-title {
            font-size: 2.2rem;
            color: #DC143C;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.8);
        }

        .card-description {
            color: #e0e0e0;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        select {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 3px solid #0047AB;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover, select:focus {
            border-color: #DC143C;
            box-shadow: 0 0 20px rgba(220, 20, 60, 0.6);
            outline: none;
            background: rgba(0, 0, 0, 0.95);
        }

        option {
            background: #1a1a1a;
            color: #fff;
            padding: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            border: 3px solid #DC143C;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 8px 25px rgba(220, 20, 60, 0.5);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #FF1744 0%, #DC143C 100%);
            box-shadow: 0 12px 40px rgba(220, 20, 60, 0.8);
            transform: translateY(-3px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #DC143C;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #fff;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Résultat du film */
        .movie-result {
            display: none;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #0047AB;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 15px 50px rgba(0, 71, 171, 0.6),
                0 0 100px rgba(220, 20, 60, 0.4);
            animation: slideIn 0.5s ease-out;
        }

        .movie-result.active {
            display: flex;
            flex-wrap: wrap;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .movie-poster {
            flex: 0 0 350px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info {
            flex: 1;
            padding: 40px;
            min-width: 300px;
        }

        .movie-title {
            font-size: 2.8rem;
            color: #DC143C;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.8);
        }

        .movie-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
        }

        .badge-rating {
            background: #0047AB;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 71, 171, 0.5);
        }

        .badge-date {
            background: #DC143C;
            color: #fff;
            box-shadow: 0 4px 15px rgba(220, 20, 60, 0.5);
        }

        .movie-overview {
            color: #e0e0e0;
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn-new-search {
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #0047AB 0%, #003380 100%);
            border: 2px solid #0047AB;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 71, 171, 0.4);
        }

        .btn-new-search:hover {
            background: linear-gradient(135deg, #0066FF 0%, #0047AB 100%);
            box-shadow: 0 8px 30px rgba(0, 71, 171, 0.7);
            transform: translateY(-2px);
        }

        .footer-info {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid rgba(220, 20, 60, 0.6);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-top: 40px;
            backdrop-filter: blur(10px);
        }

        .footer-info h3 {
            color: #DC143C;
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-shadow: 0 0 15px rgba(220, 20, 60, 0.8);
        }

        .footer-info p {
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 1rem;
        }

        .footer-info code {
            background: rgba(220, 20, 60, 0.2);
            padding: 4px 10px;
            border-radius: 5px;
            color: #DC143C;
            font-family: monospace;
            border: 1px solid rgba(220, 20, 60, 0.4);
        }

        .footer-info a {
            color: #0047AB;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-info a:hover {
            color: #0066FF;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 3rem;
                letter-spacing: 4px;
            }

            .card {
                padding: 25px;
            }

            .movie-poster {
                flex: 0 0 100%;
                height: 450px;
            }

            .movie-info {
                padding: 25px;
            }

            .movie-title {
                font-size: 2rem;
            }
        }
        /* ================= RESPONSIVE DESIGN ================= */

/* Tablettes */
@media (max-width: 1024px) {

    .title {
        font-size: 3.5rem;
        letter-spacing: 4px;
    }

        flex-direction: column;
    }

    .movie-poster {
        flex: 0 0 100%;
        height: 400px;
    }

    .movie-info {
        padding: 30px;
    }
}

/* Téléphones */
@media (max-width: 768px) {

    body {
        overflow-x: hidden;
    }

    .container {
        padding: 15px;
    }

    .title {
        font-size: 2.3rem;
        letter-spacing: 2px;
        text-align: center;
    }

    .card {
        padding: 20px;
    }

    .card-title {
        font-size: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
    }

    select {
        font-size: 1rem;
        padding: 12px;
    }

    .btn-submit {
        font-size: 1rem;
        padding: 15px;
    }

    .movie-title {
        font-size: 1.6rem;
    }

    .movie-overview {
        font-size: 1rem;
    }

    .corner-web,
    .floating-web {
        display: none; /* Cache les décorations lourdes sur mobile */
    }
}

/* Petits téléphones */
@media (max-width: 480px) {

    .title {
        font-size: 1.8rem;
    }

    .card {
        padding: 15px;
    }

    .movie-info {
        padding: 20px;
    }

    .badge {
        font-size: 0.8rem;
        padding: 6px 12px;
    }

    .btn-new-search {
        width: 100%;
        text-align: center;
    }
}
    </style>

                </div>

                <div class="form-group">
                    <label for="language">Langue du film 🌍</label>
                    <select id="language" name="language" required>
                        <option value="">Choisissez la langue</option>
                        <option value="français">🇫🇷 Français</option>
                        <option value="anglais">🇬🇧 Anglais</option>
                        <option value="espagnol">🇪🇸 Espagnol</option>
                        <option value="allemand">🇩🇪 Allemand</option>
                        <option value="italien">🇮🇹 Italien</option>
                        <option value="japonais">🇯🇵 Japonais</option>
                        <option value="coréen">🇰🇷 Coréen</option>
                        <option value="chinois">🇨🇳 Chinois</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="genre">Genre de film 🎬</label>
                    <select id="genre" name="genre" required>
                        <option value="">Choisissez le genre</option>
                        <option value="action">💥 Action</option>
                        <option value="aventure">🗺️ Aventure</option>
                        <option value="animation">🎨 Animation</option>
                        <option value="comédie">😂 Comédie</option>
                        <option value="crime">🔪 Crime</option>
                        <option value="documentaire">📹 Documentaire</option>
                        <option value="drame">🎭 Drame</option>
                        <option value="famille">👨‍👩‍👧‍👦 Famille</option>
                        <option value="fantaisie">🧙‍♂️ Fantaisie</option>
                        <option value="horreur">👻 Horreur</option>
                        <option value="romance">❤️ Romance</option>
                        <option value="science-fiction">🚀 Science-Fiction</option>
                        <option value="thriller">😰 Thriller</option>
                        <option value="western">🤠 Western</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    ✨ Obtenir ma recommandation ✨
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p class="loading-text">Miandry fa mbola mitady izay ilainao i Mamihery...</p>
            </div>
        </div>

        <!-- Résultat du film -->
        <div class="movie-result" id="movieResult">
            <div class="movie-poster" id="moviePoster">
                <img id="posterImage" src="" alt="Affiche du film">
            </div>
            <div class="movie-info">
                <h2 class="movie-title" id="movieTitle"></h2>
                <div class="movie-meta">
                    <span class="badge badge-rating" id="movieRating"></span>
                    <span class="badge badge-date" id="movieDate"></span>
                </div>
                <p class="movie-overview" id="movieOverview"></p>
                <button class="btn-new-search" onclick="resetSearch()">🔍 Chercher un autre film</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('movieForm');
        const loading = document.getElementById('loading');
        const movieResult = document.getElementById('movieResult');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mood = document.getElementById('mood').value;
            const language = document.getElementById('language').value;
            const genre = document.getElementById('genre').value;

            if (!mood || !language || !genre) {
                alert('Veuillez remplir tous les champs!');
                return;
            }

            // Afficher le loading
            loading.classList.add('active');
            movieResult.classList.remove('active');
            submitBtn.disabled = true;

            try {
                // Appel au backend Flask avec Groq
                const response = await fetch('/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        mood: mood,
                        language: language,
                        genre: genre
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    loading.classList.remove('active');
                    submitBtn.disabled = false;
                    return;
                }

                // Afficher le résultat
                displayMovie(data);
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de la connexion au serveur. Assurez-vous que le backend Flask est lancé sur http://localhost:5000');
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = false;
            }
        });

        function displayMovie(movie) {
            document.getElementById('movieTitle').textContent = movie.title;
            document.getElementById('movieRating').textContent = movie.rating || '⭐ 8.5/10';
            document.getElementById('movieDate').textContent = movie.date || '📅 2024';
            document.getElementById('movieOverview').textContent = movie.overview;

            // Utiliser l'image du film si disponible, sinon une image par défaut
            const posterUrl = movie.poster_url || 'https://via.placeholder.com/350x500/1a1a1a/DC143C?text=' + encodeURIComponent(movie.title);
            
            document.getElementById('posterImage').src = posterUrl;
            document.getElementById('posterImage').alt = movie.title;

            movieResult.classList.add('active');
            movieResult.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetSearch() {
            movieResult.classList.remove('active');
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
