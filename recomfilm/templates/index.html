<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Quiz Intelligent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <section class="panel hero">
            <h1>Générateur de Quiz Intelligent</h1>
            <p>Entrez un thème, choisissez les paramètres et laissez l'IA construire votre QCM.</p>
        </section>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="panel">
                    {% for category, message in messages %}
                        <div class="alert {{ 'alert-error' if category == 'error' else 'alert-info' }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        <section class="panel">
            <form method="post" action="{{ url_for('generate') }}" class="quiz-form">
                <label for="theme">Thème du quiz</label>
                <input id="theme" name="theme" type="text" placeholder="Ex: Algorithmes, Histoire, Réseaux" required>

                <label for="num_questions">Nombre de questions (3 à 10)</label>
                <input id="num_questions" name="num_questions" type="number" min="3" max="10" value="5" required>

                <label for="difficulty">Niveau de difficulté</label>
                <select id="difficulty" name="difficulty" required>
                    <option value="Facile">Facile</option>
                    <option value="Moyen" selected>Moyen</option>
                    <option value="Difficile">Difficile</option>
                </select>

                <button type="submit">Générer le quiz</button>
            </form>
        </section>
    </main>
</body>
</html>
